name: Documentation Tests

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

# Least-privilege default for all jobs (they only read the repo, run tests, and
# build docs). Overrides GitHub's permissive default token (CodeQL:
# actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test-docs:
    name: Test Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[docs]"

    - name: Run unit tests
      run: |
        pytest tests/ -v -m unit

    - name: Run integration tests (fast)
      run: |
        pytest tests/ -v -m integration --maxfail=3

    - name: Run functional tests (fixture stores)
      run: |
        pytest tests/ -v -m functional

    - name: Run metadata engine tests
      run: |
        pytest tests/metadata -v -m "not live"

    - name: Build documentation (HTML)
      run: |
        sphinx-build -W -b html docs docs/_build/html

    - name: Check external links
      run: |
        # Allow link check to fail but still report results
        sphinx-build -b linkcheck docs docs/_build/linkcheck || echo "Some links may be broken - check output"
      continue-on-error: true

    - name: Upload build artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.sha }}
        path: |
          docs/_build/
        retention-days: 7

    - name: Upload documentation artifacts
      if: success() && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: documentation-${{ github.sha }}
        path: docs/_build/html/
        retention-days: 30

  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8

    - name: Check code formatting with Black
      run: |
        black --check tests/

    - name: Check import sorting with isort
      run: |
        isort --check-only tests/

    - name: Lint with flake8
      run: |
        flake8 tests/ --max-line-length=100 --extend-ignore=E203,W503
