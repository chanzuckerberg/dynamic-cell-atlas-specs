[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dca_helpers"
dynamic = ["version"]
description = "Helper utilities for reading and writing Dynamic Cell Atlas OME-Zarr imaging data"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE.md"]
dependencies = [
    "zarr>=3.1.6",
    "numpy",
    "acquire-zarr>=0.6.0",
    "pytest>=7.0",
    "dask>=2026.1.2",
    "xarray>=2026.2.0",
    "ome-zarr-models>=1.7",
    "obstore>=0.9",
    "pydantic>=2",
    "click>=8",
    "rich>=13",
    "boto3>=1.34",
    "requests>=2.31",
    "pyarrow>=17",
]

[project.scripts]
dca-validate = "dca_helpers.validation.cli:main"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0",
    "linkml>=1.7",
    # Test-only: the JSON Schema oracle (tests/validation/json_schema_oracle.py)
    # cross-checks the runtime Pydantic rules against the generated JSON Schema.
    # Not a runtime dependency — the validator enforces the Pydantic models.
    "jsonschema>=4.18",
]
docs = [
    "sphinx>=5.0",
    "pydata-sphinx-theme",
    "sphinxcontrib-mermaid",
    "sphinx-reredirects",
    "sphinx-autobuild",
    "pytest>=7.0",
    "pyyaml>=6.0"
]

[tool.setuptools.dynamic]
version = { file = "CURRENT_VERSION" }

[tool.setuptools.packages.find]
where = ["helpers/src"]

[tool.isort]
profile = "black"
known_first_party = ["dca_helpers"]
