# Pre-commit configuration to match GitHub Actions checks exactly
# This ensures local development catches the same issues as CI/CD pipeline

repos:
  # Basic repository maintenance hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$  # Markdown might need trailing spaces for line breaks
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']  # Allow larger files for documentation assets
      - id: check-merge-conflict
      - id: debug-statements

  # Python import sorting - matches "isort --check-only tests/" from GitHub Actions
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--check-only", "--diff"]
        files: ^(helpers/src|tests)/.*\.py$

  # Python code formatting - matches "black --check tests/" from GitHub Actions
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: ["--check", "--diff"]
        files: ^(helpers/src|tests)/.*\.py$

  # Python linting - matches "flake8 tests/ --max-line-length=100 --extend-ignore=E203,W503" from GitHub Actions
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args: ["--max-line-length=100", "--extend-ignore=E203,W503"]
        files: ^(helpers/src|tests)/.*\.py$

  # Documentation-specific hooks for this specification repository
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=czi,zarr,ngff,ome,multiresolution,chanzuckerberg,lod,nd,crate
          - --skip="*.git,*.pyc,*/_build/*,*/node_modules/*"
        exclude: ^(\.git|_build)/
